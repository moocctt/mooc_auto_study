<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="mooc 学习协议工具集：登录协议复现、学习心跳伪造、进度上报">
  <title>MOOC 学习协议工具集</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1A"/>
      <stop offset="1" stop-color="#101B2D"/>
    </linearGradient>
    <linearGradient id="beat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="0.55" stop-color="#4CC2FF"/>
      <stop offset="1" stop-color="#7C8CFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- 网格 -->
  <g stroke="#1B2740" stroke-width="1">
    <path d="M0 105h1200M0 210h1200M0 315h1200"/>
    <path d="M150 0v420M300 0v420M450 0v420M600 0v420M750 0v420M900 0v420M1050 0v420"/>
  </g>

  <!-- 左侧文案 -->
  <text x="64" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" fill="#6E82A6" letter-spacing="3">REVERSE ENGINEERED · mooc.ctt.cn</text>

  <text x="64" y="158" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="52" font-weight="700" fill="#EAF2FF">MOOC 学习协议工具集</text>

  <text x="64" y="204" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="22" fill="#9FB0CC">登录复现 · 心跳守活 · 学时进度自动化</text>

  <!-- 协议标签 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <rect x="64" y="248" width="196" height="44" rx="10" fill="#13203A" stroke="#25406B"/>
    <text x="84" y="277" fill="#8FC7FF">app-login</text>

    <rect x="274" y="248" width="150" height="44" rx="10" fill="#13203A" stroke="#25406B"/>
    <text x="294" y="277" fill="#8FC7FF">Bearer__</text>

    <rect x="438" y="248" width="214" height="44" rx="10" fill="#13203A" stroke="#25406B"/>
    <text x="458" y="277" fill="#8FC7FF">start-progress</text>

    <rect x="666" y="248" width="204" height="44" rx="10" fill="#13203A" stroke="#25406B"/>
    <text x="686" y="277" fill="#8FC7FF">video-progress</text>

    <rect x="884" y="248" width="252" height="44" rx="10" fill="#1A2E24" stroke="#2F6B4F"/>
    <text x="904" y="277" fill="#67E2A8">finishStatus=2</text>
  </g>

  <text x="64" y="340" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="21" fill="#7E90AE">Python 3.13 · requests · 零依赖 WebSocket 客户端</text>

  <!-- 右侧心跳面板 -->
  <rect x="700" y="66" width="436" height="152" rx="16" fill="#0D1728" stroke="#24405F"/>
  <text x="724" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" fill="#6E82A6">wss /course-study/ws/course</text>

  <path d="M724 156h52l14-34 18 62 16-40 14 24 22-12h44l14-30 16 48 14-18h40l12-26 14 40 12-14h130"
        fill="none" stroke="url(#beat)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <circle cx="1160" cy="156" r="6" fill="#3DDC97"/>
  <text x="724" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" fill="#8FA6C8">PING → PONG   每 10s   守活</text>
</svg>
