  <title id="t">tobacco-mooc-study 主视觉</title>
  <desc id="d">用中文对 AI 助手说需求，即可管理烟草网络学院的学时、计划与课程学习</desc>
  <rect width="1200" height="400" fill="#F4F8F5"/>
