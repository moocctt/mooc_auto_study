<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="t d" font-family="PingFang SC,Microsoft YaHei,system-ui,sans-serif">
  <title id="t">tobacco-mooc-study 浏览器扩展主视觉</title>
  <desc id="d">浏览器里的烟草网络学院学时面板：账单、任务、截止提醒与热力图，数据只留在本机</desc>
  <rect width="1200" height="400" fill="#F4F8F5"/>
