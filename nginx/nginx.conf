# 完整 nginx 主配置（/etc/nginx/nginx.conf）。
# wslc 部署时整文件挂载：wslc run -v "$(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine
# docker-compose 部署只挂 server 块（nginx/default.conf → conf.d/default.conf）。
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  access_log off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 宿主机 TLS 终结时会传入 https 的 X-Forwarded-Proto：优先透传，缺失时回落到本层协议
  map $http_x_forwarded_proto $xfp {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  upstream backend {
    server app:8080;
  }

  # 80 只做强制跳转：登录表单提交本站与平台账号密码，明文 HTTP 等于把凭据暴露给链路上任何一跳
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 自签证书生成见 docs/DEPLOY.md「证书」一节；路径与 wslc 的挂载一致
    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端静态资源由 Express 托管，nginx 只做反代
    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $xfp;
    }

    # 引擎状态轮询走 HTTP 短连接，不做特殊配置；若日后改 SSE 需关闭缓冲
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $xfp;
      proxy_read_timeout 60s;
    }
  }
}
